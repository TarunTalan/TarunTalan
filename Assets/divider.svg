<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 10" width="100%" height="10" fill="none">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#9b5de5" />
      <stop offset="100%" stop-color="#f15bb5" />
    </linearGradient>
  </defs>
  <style>
    .wave {
      stroke: url(#grad);
      stroke-width: 2;
      stroke-linecap: round;
    }
  </style>
  <g>
    <path class="wave" d="M 0 5 Q 25 3, 50 5 T 100 5 T 150 5 T 200 5 T 250 5 T 300 5 T 350 5 T 400 5 T 450 5 T 500 5 T 550 5 T 600 5 T 650 5 T 700 5 T 750 5 T 800 5 T 850 5 T 900 5 T 950 5" />
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-100 0" dur="4s" repeatCount="indefinite" />
  </g>
</svg>
