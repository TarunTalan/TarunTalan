<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 3" width="100%" height="3" fill="none">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="200%" y2="0%">
      <animate attributeName="x1" values="0%; -100%" dur="5s" repeatCount="indefinite" />
      <animate attributeName="x2" values="200%; 100%" dur="5s" repeatCount="indefinite" />
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="25%" stop-color="#9b5de5" />
      <stop offset="50%" stop-color="#f15bb5" />
      <stop offset="100%" stop-color="#00f2fe" />
      <stop offset="125%" stop-color="#9b5de5" />
      <stop offset="150%" stop-color="#f15bb5" />
      <stop offset="200%" stop-color="#00f2fe" />
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="800" height="3" fill="url(#grad)" rx="1.5" />
</svg>
