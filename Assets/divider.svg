<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 4" width="100%" height="4" fill="none">
  <style>
    @keyframes pulse {
      0% {
        stroke-dashoffset: 800;
      }
      100% {
        stroke-dashoffset: -800;
      }
    }
    .bg-line {
      stroke: #30363d;
      stroke-width: 1.5;
      stroke-linecap: round;
      opacity: 0.3;
    }
    .pulse-line {
      stroke: url(#grad);
      stroke-width: 2;
      stroke-linecap: round;
      stroke-dasharray: 150 650;
      animation: pulse 3s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
  </style>
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2e9ef7" stop-opacity="0" />
      <stop offset="50%" stop-color="#2e9ef7" stop-opacity="1" />
      <stop offset="100%" stop-color="#a45cf6" stop-opacity="0" />
    </linearGradient>
  </defs>
  <line x1="2" y1="2" x2="798" y2="2" class="bg-line" />
  <line x1="2" y1="2" x2="798" y2="2" class="pulse-line" />
</svg>
